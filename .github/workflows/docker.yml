name: build-and-push


# Фильтр по путям здесь НЕ ставим: их поведение для пуша тегов не описано в
# документации GitHub, а тег — это релиз, который обязан собраться при любых
# условиях. Правку сайта отсекает .dockerignore: site/ не входит в контекст
# сборки, поэтому слой COPY не инвалидируется и образ берётся из кэша.
on:
  push:
    branches: [brokenkvn]
    tags: ["brokenkvn-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: remnabot
          POSTGRES_PASSWORD: remnabot
          POSTGRES_DB: remnabot
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U remnabot" --health-interval 5s --health-retries 10
    env:
      TEST_POSTGRES_DSN: postgres://remnabot:remnabot@localhost:5432/remnabot?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - run: go test ./...
      - run: go test -race ./...
  docker:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=brokenkvn
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
